<style>
  :root { --bg:#12141a; --panel:#1c1f28ee; --red:#c62828; --text:#f3f4f6; --muted:#b4b8c2; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  #map { position:absolute; inset:0; }
  .bar {
    position:absolute; z-index:1000; top:12px; left:12px; right:12px;
    display:flex; gap:10px; align-items:stretch; pointer-events:none;
  }
  .panel {
    pointer-events:auto; background:var(--panel); backdrop-filter: blur(10px);
    border-radius:14px; box-shadow:0 10px 40px #0007; padding:12px 14px;
  }
  .title { min-width:260px; max-width:420px; }
  .title h1 { font-size:16px; margin:0 0 4px; font-weight:700; }
  .title p { margin:0; font-size:12px; color:var(--muted); line-height:1.35; }
  .list {
    width:min(340px, 92vw); max-height:calc(100vh - 110px); overflow:auto;
    margin-top: 0; position:absolute; top:88px; left:12px; z-index:1000;
  }
  .list h2 { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  .tools { display:flex; gap:6px; margin-bottom:8px; }
  .tools button {
    background:#2a2f3c; color:var(--text); border:0; border-radius:8px;
    padding:6px 10px; font-size:12px; cursor:pointer;
  }
  .tools button:hover { background:#3a4154; }
  .item {
    display:flex; gap:8px; align-items:flex-start; padding:8px 6px;
    border-radius:8px; cursor:pointer; font-size:13px;
  }
  .item:hover, .item.active { background:#ffffff14; }
  .item input { margin-top:3px; accent-color: var(--red); }
  .swatch { width:12px; height:12px; border-radius:3px; background:#c6282888; border:2px solid #c62828; flex:none; margin-top:3px; }
  .leaflet-control-zoom { border:0 !important; margin-right:12px !important; margin-bottom:12px !important; }
  .leaflet-control-zoom a { background:#1c1f28ee !important; color:#fff !important; border:0 !important; }
  .leaflet-control-attribution { background:#1c1f28cc !important; color:#bbb !important; }
  .leaflet-control-attribution a { color:#ddd !important; }
  .popup-name { font-weight:700; margin:0 0 4px; }
  .popup-meta { font-size:12px; color:#444; margin:0; }
</style>
</head>

const map = L.map('map', { zoomControl: false }).setView([48.86, 2.34], 12);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

const layers = {};
const group = L.featureGroup();
DATA.features.forEach((f, i) => {
  const layer = L.geoJSON(f, {
    style: {
      color: '#b71c1c',
      weight: 2.5,
      fillColor: '#c62828',
      fillOpacity: 0.28
    }
  });
  layer.bindPopup(
    `<p class="popup-name">${f.properties.name}</p>
     <p class="popup-meta">Arrondissement ${f.properties.arr} · ~${f.properties.area_km2} km²</p>`
  );
  layer.on('click', () => highlight(f.properties.id, false));
  layers[f.properties.id] = layer;
  layer.addTo(map);
  group.addLayer(layer);
});

L.circleMarker([48.8809, 2.3553], {
  radius: 7, color: '#1a237e', weight: 2, fillColor: '#5c6bc0', fillOpacity: 1
}).bindPopup('<p class="popup-name">Gare du Nord</p><p class="popup-meta">Repère</p>').addTo(map);

function highlight(id, fly) {
  document.querySelectorAll('.item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  Object.entries(layers).forEach(([k, layer]) => {
    layer.setStyle({
      color: k === id ? '#ff1744' : '#b71c1c',
      weight: k === id ? 4 : 2.5,
      fillColor: '#c62828',
      fillOpacity: k === id ? 0.42 : 0.22
    });
  });
  if (fly && layers[id]) {
    map.fitBounds(layers[id].getBounds(), { padding: [40, 40], maxZoom: 15 });
  }
}

const items = document.getElementById('items');
DATA.features.forEach(f => {
  const id = f.properties.id;
  const row = document.createElement('div');
  row.className = 'item';
  row.dataset.id = id;
  row.innerHTML = `<input type="checkbox" checked data-id="${id}"/><span class="swatch"></span><span>${f.properties.name}</span>`;
  row.addEventListener('click', (e) => {
    if (e.target.tagName === 'INPUT') return;
    const cb = row.querySelector('input');
    if (!cb.checked) { cb.checked = true; map.addLayer(layers[id]); }
    highlight(id, true);
  });
  row.querySelector('input').addEventListener('change', (e) => {
    if (e.target.checked) map.addLayer(layers[id]);
    else map.removeLayer(layers[id]);
  });
  items.appendChild(row);
});

document.getElementById('all').onclick = () => {
  document.querySelectorAll('.item input').forEach(cb => { cb.checked = true; map.addLayer(layers[cb.dataset.id]); });
};
document.getElementById('none').onclick = () => {
  document.querySelectorAll('.item input').forEach(cb => { cb.checked = false; map.removeLayer(layers[cb.dataset.id]); });
};
document.getElementById('fit').onclick = () => map.fitBounds(group.getBounds(), { padding: [30, 30] });

map.fitBounds(group.getBounds(), { padding: [30, 30] });
</script>
